# Template d'expérience (bac à sable)
#
# But : regrouper configuration + artefacts par expérience, de manière reproductible.
# Le ui_cli peut être lancé avec :
#   PYTHONPATH=services python -m ui_cli.app.main --experience cours4 --arene cours4_tiny_planification --agent aleatoire --episodes 50
#
# Remarque : ce fichier est volontairement simple. Le ui_cli crée le bac à sable
# s'il n'existe pas, mais ne dépend pas encore fortement de ce YAML.

id: cours4
nom: "cours 4 — world model + MPC + observateur + APK"

# Valeurs par défaut suggérées (peuvent être surchargées par la ligne de commande)
parametres:
  arene: cours4_tiny_planification
  agent: planif_mpc_observateur_tabulaire
  latent: signaux_percus_hash_v1
  episodes: 200
  max_ticks: 2000
  seed: 123
  niveau_bruit: 0

# Organisation des sorties sous donnees/config/experiences/<id>/artefacts/
artefacts:
  runs_dir: artefacts/runs
  journal_basename: journal_episodes.jsonl
  stdout_basename: stdout.log
  meta_basename: meta.json
# s'il n'existe pas encore, mais ne devine pas vos choix : vous les fixez ici.

experience_id: _template

# Valeurs par défaut (peuvent être surchargées en CLI)
defauts:
  arene: cours4_tiny_planification
  agent: aleatoire
  latent: checksum
  episodes: 200
  max_ticks: 2000
  seed: 123
  niveau_bruit: 0

# Convention de répertoires (créée automatiquement)
#
# donnees/config/experiences/<experience_id>/
#   experience.yml
#   artefacts/
#     runs/
#       <run_id>/
#         journal_episodes.jsonl
#         stdout.log
#         meta.json
#         metrics.jsonl (optionnel)
