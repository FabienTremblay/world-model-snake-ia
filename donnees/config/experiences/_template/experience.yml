# Template d'expérience — conforme au ui_cli
#
# Ce fichier est lu par BacASableV1 (experience.yml) et sert de *defaults*.
# Le CLI applique les defaults uniquement si l'utilisateur ne surcharge pas en ligne de commande.
#
# Exemples:
#   Legacy (épisodes):
#     PYTHONPATH=services python -m ui_cli.app.main --experience <id> --arene demo_v0 --agent aleatoire --episodes 50
#   Événements (RunnerEvenementsV2):
#     PYTHONPATH=services python -m ui_cli.app.main evenements --experience <id> --ticks 50 --mode entrainement
#
# Important:
# - `--experience` est requis: les artefacts vont sous donnees/config/experiences/<id>/artefacts/
# - la section `evenements` est utilisée par `ui_cli evenements`

id: CHANGER_MOI
description: ""

arene:
  id: demo_v0

agent:
  id: aleatoire

latent: checksum

generation:
  episodes: 100
  max_ticks: 2000
  seed: 123
  niveau_bruit: null

sorties:
  # BacASableV1: run_dir est relatif à l'expérience
  run_dir: artefacts/runs
  journal: journal_episodes.jsonl
  capture_stdout: false

evenements:
  # Defaults de `ui_cli evenements`
  mode: entrainement      # entrainement | epreuve
  ticks: 200              # défaut CLI actuel
  publier_ticks: false
  arene: demo_v0          # override si CLI laisse demo_v0
  seed: null              # override si CLI seed=None
  run_tag: null
  stub:
    direction: avant
    inaction: false

notes:
  - "template conforme au ui_cli (legacy + evenements)"
