# donnees/config/experiences/JEPA-1/experience.yml
# Bac à sable JEPA-1 (prototype confiné)

id: JEPA-1
description: "JEPA-1 — collecte contrôlée (fourmi) puis entraînement hypothèse prédictive capteurs projetés."

arene:
  # chemin relatif au repo (car se termine par .yml)
  id: donnees/config/experiences/JEPA-1/arenes/fourmi_v1.yml

agent:
  # agent existant (plug-in)
  id: snake_collectif_v1_fourmi

latent: checksum

generation:
  episodes: 30
  max_ticks: 300
  seed: 123
  niveau_bruit: 0

sorties:
  journal: journal_episodes.jsonl
  capture_stdout: true

# Conventions du pipeline (utilisées par `ui_cli pipeline run`).
pipeline:
  run_tag_collecte: jepa1_collecte_fourmi
  journal_stable: artefacts/datasets/journal_episodes_fourmi.jsonl
  journal_enrichi_stable: artefacts/datasets/journal_episodes_fourmi.enrichi.jsonl
  paires_stable: artefacts/datasets/paires_capteurs.pt
  config_entrainement: entrainement/config_entrainement.json
  config_epreuve: epreuve/config_epreuve.json

notes:
  - "Ce fichier sert surtout à fournir des defaults à ui_cli pour JEPA-1."
